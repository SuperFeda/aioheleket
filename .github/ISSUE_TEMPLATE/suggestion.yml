name: Suggestion
description: Create a suggestion ticket
title: "[*] "
labels: 
  - suggestion
body:
  - type: textarea
    attributes:
      label: The suggestion
      description: Describe the idea you have for the aioheleket. Include details such as what the feature would do or what aspect of the library it improves.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Why should it be in the library?
      description: Describe why you would like to see this idea in the library.
    validations:
      required: true

  - type: checkboxes
    attributes:
      label: Please read and confirm the following
      options:
        - label: I have confirmed this suggestion is unique and has not been suggested already.
          required: true

